<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03070d"><title>Pixel Face V2</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070d;color:#dcf8ff;font:14px system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.toolbar{position:fixed;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;gap:7px;background:#0b1725ed;border:1px solid #294b60;border-radius:13px;padding:10px;max-height:70vh;overflow:auto}.toolbar.hidden{display:none}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row label{min-width:95px}.row input[type=range]{flex:1;min-width:100px}button,select{border:1px solid #38647a;background:#183349;color:#e4faff;border-radius:8px;padding:9px 11px;font:inherit}button.active{background:#146c91;border-color:#7de4ff}button:active{transform:scale(.98)}.small{font-size:12px;color:#a6c7d5}.show{position:fixed;bottom:12px;right:12px;background:#102c3fdd}.status{position:fixed;top:7px;left:10px;font-size:11px;color:#91b6c6;pointer-events:none}.hide{display:none!important}video{display:none}
</style></head><body><canvas id="face" aria-label="Pixel animated face"></canvas><video id="camera" playsinline muted></video><div class="status" id="status">Pixel V2 · Finger tracking ready</div><button id="show" class="show hide">⚙ Controls</button><div class="toolbar" id="toolbar"><div class="row" id="moods"></div><div class="row"><button id="finger" class="active">☝ Finger follow: ON</button><button id="cameraBtn">📷 Face tracking</button><button id="micBtn">🎙 Sound test</button><button id="talkBtn">🗣 Talking: OFF</button></div><div class="row"><label for="height">Face height</label><input id="height" type="range" min="-35" max="35" value="-12"><span id="heightValue">-12%</span><label for="scale">Face size</label><input id="scale" type="range" min="55" max="115" value="85"><span id="scaleValue">85%</span></div><div class="row"><button id="fullscreen">⛶ Fullscreen</button><button id="hide">Hide controls</button><button id="reset">Reset</button></div><div class="small" id="note">Camera tracking requires HTTPS or localhost and an internet connection for the detector. Camera frames stay on this device. Sound test may not work while ChatGPT Voice is using the mic.</div></div>
<script>
(()=>{'use strict';const canvas=document.getElementById('face'),ctx=canvas.getContext('2d'),status=document.getElementById('status');const $=id=>document.getElementById(id);const moods=['Happy','Curious','Thinking','Surprised','Sleepy','Listening','Talking'];let mood='Happy',finger=true,cameraOn=false,micOn=false,talking=false,look={x:0,y:0},target={x:0,y:0},lastTouch=0,blink=0,nextBlink=performance.now()+1900,level=0,micCtx,micStream,analyser,micData,camStream,detector,detectorBusy=false,lastDetection=0;const stored=JSON.parse(localStorage.getItem('pixelV2')||'{}');$('height').value=stored.height??-12;$('scale').value=stored.scale??85;const save=()=>localStorage.setItem('pixelV2',JSON.stringify({height:$('height').value,scale:$('scale').value}));function msg(s){status.textContent='Pixel V2 · '+s}function setMood(m){mood=m;document.querySelectorAll('[data-mood]').forEach(b=>b.classList.toggle('active',b.dataset.mood===m))}moods.forEach(m=>{let b=document.createElement('button');b.textContent=m;b.dataset.mood=m;b.onclick=()=>setMood(m);$('moods').append(b)});setMood('Happy');function syncSliders(){ $('heightValue').textContent=$('height').value+'%';$('scaleValue').textContent=$('scale').value+'%';save()}$('height').oninput=$('scale').oninput=syncSliders;syncSliders();$('reset').onclick=()=>{$('height').value=-12;$('scale').value=85;syncSliders();target={x:0,y:0}};$('finger').onclick=()=>{finger=!finger;$('finger').textContent='☝ Finger follow: '+(finger?'ON':'OFF');$('finger').classList.toggle('active',finger);msg(finger?'Finger tracking ready':'Finger tracking off')};$('talkBtn').onclick=()=>{talking=!talking;$('talkBtn').textContent='🗣 Talking: '+(talking?'ON':'OFF');$('talkBtn').classList.toggle('active',talking);setMood(talking?'Talking':'Happy')};$('hide').onclick=()=>{$('toolbar').classList.add('hidden');$('show').classList.remove('hide')};$('show').onclick=()=>{$('toolbar').classList.remove('hidden');$('show').classList.add('hide')};$('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){msg('Fullscreen unavailable in this browser')}};function track(x,y){target.x=Math.max(-1,Math.min(1,(x/window.innerWidth-.5)*2));target.y=Math.max(-1,Math.min(1,(y/window.innerHeight-.5)*2));lastTouch=performance.now()}canvas.addEventListener('pointermove',e=>{if(finger&&!cameraOn)track(e.clientX,e.clientY)});canvas.addEventListener('pointerdown',e=>{if(finger&&!cameraOn)track(e.clientX,e.clientY)});
async function stopCamera(){cameraOn=false;$('cameraBtn').classList.remove('active');$('cameraBtn').textContent='📷 Face tracking';if(camStream)camStream.getTracks().forEach(t=>t.stop());camStream=null;$('camera').srcObject=null;msg('Camera off')}
$('cameraBtn').onclick=async()=>{if(cameraOn){await stopCamera();return}if(!navigator.mediaDevices?.getUserMedia){msg('Camera needs HTTPS/localhost');return}try{msg('Requesting camera permission…');camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});$('camera').srcObject=camStream;await $('camera').play();cameraOn=true;finger=false;$('finger').classList.remove('active');$('finger').textContent='☝ Finger follow: OFF';$('cameraBtn').classList.add('active');$('cameraBtn').textContent='📷 Camera: ON';msg('Loading face detector…');if('FaceDetector' in window){detector=new FaceDetector({fastMode:true,maxDetectedFaces:1});msg('Face tracking active (native)')}else{await new Promise((resolve,reject)=>{if(window.faceapi){resolve();return}let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js';s.onload=resolve;s.onerror=reject;document.head.append(s)});detector=new FaceDetection({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`});detector.setOptions({model:'short',minDetectionConfidence:.5});detector.onResults(r=>{let d=r.detections?.[0];if(!d)return;let b=d.boundingBox;target.x=Math.max(-1,Math.min(1,(.5-(b.xCenter??.5))*1.7));target.y=Math.max(-1,Math.min(1,((b.yCenter??.5)-.5)*1.5))});msg('Face tracking active (MediaPipe)')} }catch(e){await stopCamera();msg('Camera unavailable: '+(e.name||'check HTTPS / connection'))}};
async function detect(t){if(!cameraOn||!detector||detectorBusy||t-lastDetection<120||$('camera').readyState<2)return;lastDetection=t;detectorBusy=true;try{if('FaceDetector' in window&&detector instanceof FaceDetector){let r=await detector.detect($('camera'));if(r.length){let b=r[0].boundingBox;target.x=Math.max(-1,Math.min(1,(.5-(b.x+b.width/2)/$('camera').videoWidth)*1.7));target.y=Math.max(-1,Math.min(1,((b.y+b.height/2)/$('camera').videoHeight-.5)*1.5))}}else await detector.send({image:$('camera')})}catch(e){msg('Face detector error; try finger mode')}finally{detectorBusy=false}}
$('micBtn').onclick=async()=>{if(micOn){micOn=false;$('micBtn').classList.remove('active');$('micBtn').textContent='🎙 Sound test';micStream?.getTracks().forEach(t=>t.stop());await micCtx?.close();level=0;msg('Sound test off');return}try{micStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});micCtx=new (window.AudioContext||window.webkitAudioContext)();let src=micCtx.createMediaStreamSource(micStream);analyser=micCtx.createAnalyser();analyser.fftSize=512;micData=new Uint8Array(analyser.fftSize);src.connect(analyser);micOn=true;$('micBtn').classList.add('active');$('micBtn').textContent='🎙 Sound: ON';msg('Sound reactive (mic may conflict with ChatGPT)')}catch(e){msg('Microphone unavailable: '+(e.name||'permission denied'))}};
function rounded(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()}function ellipse(x,y,rx,ry,color,glow=0){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);ctx.fillStyle=color;ctx.shadowColor='#69ddff';ctx.shadowBlur=glow;ctx.fill();ctx.shadowBlur=0}function arcEye(x,y,w,h,down=false){ctx.beginPath();ctx.moveTo(x-w,y+(down?-h:h));ctx.quadraticCurveTo(x,y+(down?h:-h),x+w,y+(down?-h:h));ctx.lineWidth=9;ctx.lineCap='round';ctx.strokeStyle='#80e7ff';ctx.shadowColor='#4bd5ff';ctx.shadowBlur=13;ctx.stroke();ctx.shadowBlur=0}function draw(t){const dpr=Math.min(2,devicePixelRatio||1),w=window.innerWidth,h=window.innerHeight;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#03070d';ctx.fillRect(0,0,w,h);let s=Math.min(w/370,h/200)*Number($('scale').value)/100;let cx=w/2,cy=h*(.50+Number($('height').value)/100);look.x+=(target.x-look.x)*.065;look.y+=(target.y-look.y)*.065;if(!cameraOn&&t-lastTouch>4000){target.x=Math.sin(t/2100)*.23;target.y=Math.sin(t/3200)*.11}if(t>nextBlink){blink=t+145;nextBlink=t+2400+Math.random()*2800}let closed=t<blink||mood==='Sleepy';let ex=61*s,ey=-26*s,ew=18*s,eh=27*s;for(let side of [-1,1]){let x=cx+side*ex+look.x*8*s,y=cy+ey+look.y*6*s;if(closed||mood==='Happy'){arcEye(x,y,22*s,17*s,closed);continue}if(mood==='Thinking'){rounded(x-22*s,y-4*s,44*s,10*s,5*s,'#80e7ff');continue}let rw=(mood==='Surprised'?23:ew),rh=(mood==='Surprised'?31:eh);ellipse(x,y,rw+4*s,rh+4*s,'#1d748a',15*s);ellipse(x,y,rw,rh,'#80e7ff',13*s);ellipse(x+5*s,y-8*s,5*s,7*s,'#e9fcff')}let mouthY=cy+43*s;let speaking=talking||mood==='Talking';if(micOn&&analyser){analyser.getByteTimeDomainData(micData);let sum=0;for(let v of micData){let a=(v-128)/128;sum+=a*a}level+=(Math.min(1,Math.sqrt(sum/micData.length)*8)-level)*.25}else level+=(0-level)*.08;if(speaking||level>.07||mood==='Surprised'){let opening=mood==='Surprised'?16:(speaking?6+Math.abs(Math.sin(t/125))*15:5+level*28);ellipse(cx,mouthY,15*s,opening*s,'#80e7ff',7*s)}else{ctx.beginPath();ctx.moveTo(cx-19*s,mouthY-3*s);ctx.quadraticCurveTo(cx,mouthY+15*s,cx+19*s,mouthY-3*s);ctx.strokeStyle='#80e7ff';ctx.lineWidth=4*s;ctx.lineCap='round';ctx.shadowColor='#54dcff';ctx.shadowBlur=7*s;ctx.stroke();ctx.shadowBlur=0}detect(t);requestAnimationFrame(draw)}requestAnimationFrame(draw);window.addEventListener('pagehide',()=>{camStream?.getTracks().forEach(t=>t.stop());micStream?.getTracks().forEach(t=>t.stop())});})();
</script></body></html>
